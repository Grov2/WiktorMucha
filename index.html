<!doctype html>
<html>
<head>
  <title>WiktorMucha</title>
  <meta charset='UTF-8'>
    <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
      color: #541d37;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 105%, rgba(255, 66, 128, .48), transparent 42%),
        radial-gradient(ellipse at 12% 18%, rgba(255, 220, 234, .5), transparent 32%),
        linear-gradient(145deg, #df9bb5 0%, #c45b83 48%, #a83d68 100%);
    }
    .hello-message {
      position: relative;
      z-index: 1;
      width: min(100% - 32px, 760px);
      margin: 24px auto;
      padding: 72px 28px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 24px;
      background: linear-gradient(140deg, rgba(255, 246, 250, .62), rgba(255, 220, 234, .28));
      box-shadow: 0 28px 90px rgba(119, 36, 73, .2), inset 0 1px 0 rgba(255, 255, 255, .85);
      backdrop-filter: blur(22px) saturate(1.5);
      -webkit-backdrop-filter: blur(22px) saturate(1.5);
      overflow: hidden;
    }
    .hello-message::before {
      position: absolute;
      top: 0;
      left: 12%;
      width: 76%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .95), transparent);
      content: '';
    }
    .hello-message h1 {
      margin: 0 auto 32px;
      max-width: 650px;
      color: #5a1734;
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      font-weight: 500;
      line-height: 1.02;
      text-shadow: 0 3px 24px rgba(157, 47, 91, .14);
    }
    .show-more-image {
      display: inline-block;
      padding: 15px 34px;
      border: 1px solid rgba(255, 255, 255, .75);
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #ba3568, #811b4b);
      box-shadow: 0 10px 28px rgba(105, 15, 55, .38), inset 0 1px 0 rgba(255, 255, 255, .35);
      font: 600 1rem/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: .04em;
    }
    .flames {
      position: fixed;
      z-index: 0;
      right: 0;
      bottom: -2px;
      left: 0;
      height: min(26vh, 210px);
      overflow: hidden;
      pointer-events: none;
      filter: drop-shadow(0 -8px 20px rgba(255, 73, 116, .18));
    }
    .flames::before,
    .flames::after {
      position: absolute;
      right: -4%;
      bottom: -22%;
      left: -4%;
      height: 118%;
      border-radius: 48% 52% 0 0 / 34% 40% 0 0;
      content: '';
      transform-origin: 50% 100%;
      animation: flame-sway 4s ease-in-out infinite alternate;
    }
    .flames::before {
      background: linear-gradient(0deg, #a91d55 0%, #d23870 42%, rgba(255, 112, 151, .78) 76%, transparent 100%);
      clip-path: polygon(0 45%, 5% 29%, 9% 47%, 15% 14%, 20% 48%, 27% 24%, 32% 50%, 39% 10%, 44% 48%, 51% 22%, 57% 48%, 64% 8%, 69% 47%, 76% 20%, 82% 49%, 89% 12%, 94% 45%, 100% 25%, 100% 100%, 0 100%);
    }
    .flames::after {
      right: -8%;
      left: -8%;
      height: 92%;
      opacity: .75;
      background: linear-gradient(0deg, #d83c78 0%, #ef6893 48%, rgba(255, 165, 184, .65) 80%, transparent 100%);
      clip-path: polygon(0 53%, 8% 20%, 13% 54%, 21% 29%, 27% 55%, 34% 16%, 40% 53%, 47% 25%, 54% 56%, 61% 14%, 67% 54%, 73% 27%, 80% 55%, 87% 19%, 93% 54%, 100% 30%, 100% 100%, 0 100%);
      animation-delay: -1.7s;
      animation-duration: 5s;
    }
    @keyframes flame-sway {
      from { transform: scaleY(.92) skewX(-1deg); }
      to { transform: scaleY(1.08) skewX(1deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .flames::before, .flames::after { animation: none; }
    }
    .logout-messages {
      pointer-events: none;
      color: red;
      margin: 40px;
      position: fixed;
      top: 0;
      left: 0;
      text-shadow: 2px 2px #FFF, 4px 4px 10px #000;
    }
  </style>
  <link rel="icon" type="image/x-icon" href="media/images/ptok.jpg">

  <meta property="og:title" content="WiktorMucha" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ptoszek.pl" />
  <meta property="og:image" content="https://ptoszek.pl/media/images/ptok.jpg" />
  <meta property="og:description" content="WiktorMucha - moja strona" />
  <meta name="keywords" content="WiktorMucha, Wiktor Mucha">
  <meta name="description" content="Oficjalna strona WiktorMucha">
  <meta name="theme-color" content="#a83d68">
</head>

    <span class='show-more-image' aria-hidden='true'>Pokaż więcej</span>
  </div>
  <div class='flames' aria-hidden='true'></div>
  <div class='logout-messages'></div>
</template>
